services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - ./backend/datai:/data

  backend:
    build: ./backend
    container_name: backend

    env_file:
      - ./backend/.env.sample

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend

    env_file:
      - ./frontend/.env.sample

    ports:
      - "5173:5173"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
    data:
