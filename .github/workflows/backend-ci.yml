name: Backend CI

on:
    # push:
    #     branches:
    #         - master 


  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 21
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm install

     
      - name: Run Tests
        run: npm test