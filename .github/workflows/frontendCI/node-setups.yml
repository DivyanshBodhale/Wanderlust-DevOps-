name: code linting html 

on: 
  push: 
     branches: master 
    # workflow_call:
jobs:

    steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-node@v7
          with:
             node-version: 24
            package-manager-cache: false # Disable automatic npm caching if not required
        - run: npm ci
        - run: npm test
