name: Docker CI

on:
  workflow_call:

jobs:
  docker:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------------------------------
      # Build Frontend Docker Image
      # -------------------------------
      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:${{ github.sha }} \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:latest \
            ./frontend

      # -------------------------------
      # Build Backend Docker Image
      # -------------------------------
      - name: Build Backend Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:${{}} \
            -t ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:latest \
            ./backend

      # -------------------------------
      # Trivy Scan - Frontend
      # -------------------------------
      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      # -------------------------------
      # Trivy Scan - Backend
      # -------------------------------
      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: '1'

      # -------------------------------
      # Push Frontend Image
      # -------------------------------
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-frontend:latest

      # -------------------------------
      # Push Backend Image
      # -------------------------------
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/wanderlust-backend:latest